[project]
name = "datacontract-sifflet"
version = "0.1.0"
description = "Export an ODCS data contract to Sifflet monitors as code."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Fatoumata Dansokho", email = "fatoumata.dansokho@siffletdata.com" },
    { name = "Antoine lefebvre", email = "antoine.lefebvre@siffletdata.com" },
    { name = "Oriane Martin", email = "oriane.martin@siffletdata.com" }
]
# No "License :: OSI Approved :: MIT License" classifier: PEP 639 makes the SPDX
# `license` expression above and the License classifiers mutually exclusive, and
# setuptools >= 77 errors out when both are present.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # Keep in sync with `requires-python` below.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
keywords = [
    "data-contract",
    "data-contracts",
    "odcs",
    "open-data-contract-standard",
    "data-quality",
    "sifflet",
]
# Keep in sync with the Python classifiers above. datacontract-cli itself stops at 3.14.
requires-python = ">=3.10,<3.15"
dependencies = [
    "datacontract-cli>=1.2,<2",
    "pyyaml~=6.0.1",
    "typer>=0.18.0,<0.28",
]

# PyPI special-cases these exact names (icon + prominent placement in the
# "Project links" sidebar); unrecognised names render as plain bullets.
[project.urls]
Repository = "https://github.com/siffletdata/datacontract-sifflet"
Issues = "https://github.com/siffletdata/datacontract-sifflet/issues"

[project.scripts]
datacontract-sifflet = "datacontract_sifflet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# yarl 1.24.0 and 1.24.1 were published to PyPI with cp310-only wheels and no
# sdist, so `uv sync` fails on Python 3.11/3.12/3.13 ("no wheel for the current
# platform"). The whole 1.24.x line is affected; pin below it (resolves to the
# last good 1.23.0) until a 1.24.x with full wheels is available.
override-dependencies = [
    "yarl<1.24",
]

[tool.pytest.ini_options]
# Exclude slow tests by default; run them with `pytest -m slow` (or `-m "slow or not slow"` for everything).
# Append parallel execution with "-n 8" if desired (disable with "-n0").
addopts = "-m 'not slow'"
testpaths = ["tests"]
markers = [
    "slow: tests that are slow to run (e.g. pull large containers); deselect with '-m \"not slow\"'",
]
log_level = "INFO"
#log_cli = "true" #  activate live logging, do not use with -n 8 xdist option for parallel test execution: https://github.com/pytest-dev/pytest-xdist/issues/402
log_cli_level = "INFO"

# Coverage is measured to make the number visible, not to gate a pull request:
# there is deliberately no `fail_under`, so nothing here can block a merge.
# Run it locally with `pytest --cov`.
[tool.coverage.run]
source = ["datacontract_sifflet"]

[tool.coverage.report]
exclude_also = [
    # Bodies that only exist for typing; never executed at runtime.
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 120
# ruff 0.16 formats Python blocks inside markdown. The README is prose, not
# source, so formatting it here would churn the text.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pin the rule set explicitly. With only `extend-select`, the effective rules are
# whatever ruff currently defaults to, so a ruff upgrade silently changes what CI
# enforces (0.16.0 added ~1400 findings this way). New rule families are opted
# into here deliberately.
select = [
    "E4",  # ruff's default: pycodestyle imports
    "E7",  # ruff's default: pycodestyle statements
    "E9",  # ruff's default: pycodestyle runtime errors
    "F",   # ruff's default: pyflakes
    "I",   # re-order imports in alphabetic order
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
