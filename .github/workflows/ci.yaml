name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catch a datacontract-cli release that breaks this plugin. The 1.2.0 pin does
  # not change between weeks, so the scheduled run only installs the latest 1.x.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # A job-level `if` runs before the matrix exists, so it cannot read `matrix.*`.
  # The 1.2.0 pin does not change between weeks; the scheduled run only keeps latest.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          pin='{"python-version":"3.10","datacontract":"datacontract-cli==1.2.0"}'
          latest='{"python-version":"3.12","datacontract":"datacontract-cli>=1.2,<2"}'
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "include=[$latest]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$pin,$latest]" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.include) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --group dev
      - name: Install ${{ matrix.datacontract }}
        run: uv pip install --upgrade --python .venv '${{ matrix.datacontract }}'
      - name: Run tests
        # uv run would sync the lockfile and undo the datacontract-cli version selected above.
        run: uv run --no-sync pytest
